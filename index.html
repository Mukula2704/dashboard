<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Command Centre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --muted: #666;
    --accent: #c8f04a;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-head);
    min-height: 100vh;
  }

  .app { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border2);
  }

  .day-name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .day-date { font-size: 12px; color: var(--muted); font-family: var(--font-mono); margin-top: 4px; }

  .progress-wrap { text-align: right; }
  .progress-pct { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; font-family: var(--font-mono); }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .progress-bar { width: 80px; height: 3px; background: var(--surface2); border-radius: 99px; margin-top: 6px; margin-left: auto; overflow: hidden; }
  .progress-fill { height: 3px; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; }

  .day-nav { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .day-btn {
    font-family: var(--font-mono); font-size: 11px; padding: 5px 12px;
    border: 0.5px solid var(--border2); border-radius: 20px;
    background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .day-btn:hover { border-color: var(--accent); color: var(--accent); }
  .day-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }

  .section { margin-bottom: 1rem; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .section-title { font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .task {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .task:hover { border-color: var(--border2); background: var(--surface2); }
  .task.done { opacity: 0.35; }
  .task.done .task-title { text-decoration: line-through; }

  .cb {
    width: 16px; height: 16px; border: 1.5px solid var(--border2); border-radius: 4px;
    flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-size: 10px; color: var(--bg);
  }
  .task.done .cb { background: var(--accent); border-color: var(--accent); }

  .task-content { flex: 1; min-width: 0; }
  .task-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .task-sub { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); line-height: 1.6; }

  .rule-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 1.5rem; }
  .rule-box-title { font-size: 9px; font-family: var(--font-mono); color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .rule-item { font-size: 11px; color: var(--muted); font-family: var(--font-mono); padding: 5px 0; border-bottom: 0.5px solid var(--border); display: flex; gap: 8px; }
  .rule-item:last-child { border-bottom: none; }
  .rule-num { color: var(--accent); flex-shrink: 0; }

  /* Add Task UI */
  .add-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    background: none; border: 0.5px dashed var(--border2); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; width: 100%; margin-top: 4px;
    transition: all 0.15s;
  }
  .add-btn:hover { color: var(--accent); border-color: var(--accent); }

  .add-form { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 12px; margin-top: 4px; }
  .add-form input, .add-form textarea, .add-form select {
    width: 100%; background: var(--bg); border: 0.5px solid var(--border2);
    border-radius: 6px; color: var(--text); font-family: var(--font-mono);
    font-size: 12px; padding: 8px 10px; margin-bottom: 8px; outline: none;
    transition: border-color 0.15s;
  }
  .add-form input:focus, .add-form textarea:focus, .add-form select:focus { border-color: var(--accent); }
  .add-form textarea { resize: vertical; min-height: 60px; }
  .add-form select option { background: var(--bg); }
  .form-row { display: flex; gap: 8px; }
  .form-row button {
    flex: 1; padding: 8px; border-radius: 6px; font-family: var(--font-mono);
    font-size: 11px; cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-save { background: var(--accent); color: var(--bg); font-weight: 500; }
  .btn-cancel { background: var(--surface); color: var(--muted); border: 0.5px solid var(--border2) !important; }

  .task-delete {
    background: none; border: none; color: transparent; font-size: 14px;
    cursor: pointer; padding: 0 0 0 4px; flex-shrink: 0; margin-top: 1px;
    transition: color 0.15s;
  }
  .task:hover .task-delete { color: #444; }
  .task-delete:hover { color: #f04a4a !important; }

  .reset-day-btn {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    background: none; border: none; cursor: pointer; margin-top: 0.5rem;
    display: block; text-align: right; width: 100%;
    transition: color 0.15s;
  }
  .reset-day-btn:hover { color: var(--accent); }

  .saved-indicator {
    font-family: var(--font-mono); font-size: 10px; color: var(--accent);
    text-align: center; padding: 6px; opacity: 0; transition: opacity 0.3s;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div>
      <div class="day-name" id="day-name">Monday</div>
      <div class="day-date" id="day-date"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-pct" id="pct-display">0%</div>
      <div class="progress-label">done today</div>
      <div class="progress-bar"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="day-nav" id="day-nav"></div>
  <div class="saved-indicator" id="saved-indicator">✓ saved</div>
  <div id="task-area"></div>

  <div class="rule-box">
    <div class="rule-box-title">5 non-negotiables</div>
    <div class="rule-item"><span class="rule-num">01</span> No winging it — plan before you start</div>
    <div class="rule-item"><span class="rule-num">02</span> Intent over ego — no chaos, clean reps, clean code</div>
    <div class="rule-item"><span class="rule-num">03</span> Logbook law — track every workout and study session</div>
    <div class="rule-item"><span class="rule-num">04</span> Recovery matters — sleep and food are the fuel</div>
    <div class="rule-item"><span class="rule-num">05</span> No blame game — you have no one to blame</div>
  </div>

</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

const SECTION_META = {

  cds:       { label: 'CDS Prep',             color: '#4af0c8' },
  cse:       { label: 'CSE / Job Readiness',  color: '#4a8af0' },
  yt:        { label: 'YouTube / Animation',  color: '#f04a8a' },

// Base schedule — loaded from localStorage on top of this
const BASE_SCHEDULE = {

    net:       { label: 'Outreach — Freelance Clients', detail: 'Follow up with 2 potential coding / freelance clients\nPlatform: LinkedIn, Instagram — whichever gets a reply' },

    cds:       { label: 'English — Grammar Fundamentals', detail: 'Wren & Martin: Tenses + Parts of Speech rules\n+ 1 reading comprehension passage (timed)' },
    cse:       { label: 'AI-Automation Practice', detail: 'Integrate Gemini or OpenAI API into a local app\nAutomate one simple task — show working output' },
    yt:        { label: 'Keyframe Animation — Short 1', detail: 'Stickman posing and primary movements for Short 1\nFocus: clean poses, clear action beats' },
    nutrition: { label: 'Nutrition Study', detail: 'Supplement timing — pre/intra/post workout\nHigh-protein vegetarian sources deep dive' },
    skin:      { label: 'Skincare', detail: 'AM: Ice plunge 2 min → face wash → moisturiser → SPF 50\nPM: Double cleanse → spot treatment if needed → barrier cream' },
  },
  2: {
    gym:       { label: 'Active Recovery', detail: 'Lower body warm-up drills + mobility work\nLight boxing — form, not intensity\nBodyweight squats 10–15, dynamic lunges 10–12, hip hinge 8–10' },
    cds:       { label: 'Geography — Physical Geography', detail: 'Maps, Latitudes, Longitudes (Disha NCERT summary)\n+ 20 min current affairs — Inshorts, note one key headline' },
    cse:       { label: 'Database & Logic', detail: 'SQL basics + CRUD operations\nUnderstand data flow — know what each query does, don\'t just vibe-code it' },
    yt:        { label: 'Keyframe Animation — Short 2', detail: 'Stickman posing and primary movements for Short 2\nMatch pace and energy to Short 1 style' },
    net:       { label: 'Outreach — Animation Creators', detail: 'Cold DM 3 creators in the animation space\nAsk for feedback or collab — short, genuine message' },
    nutrition: { label: 'Nutrition Content', detail: 'Film or write one post: "Nutrition for Military Conditioning"\nPractical, backed by your knowledge — keep it real' },
    skin:      { label: 'Skincare', detail: 'AM: Ice plunge 2 min → face wash → moisturiser → SPF 50\nPM: Double cleanse → eye cream → barrier cream' },
  },
  3: {
    gym:       { label: 'Pull Day — Main: Cable Row', detail: 'A) Cable Row / Chest-Assisted Row × 4 sets | 6–10 reps | 2–3 min\nB) Lat Pulldowns / Pull-ups × 3 sets | 8–12 reps\nC) Pull-overs × 3 sets | 10+ reps\nD) DB Rear Delt Fly / Reverse Pec Deck × 3 sets | 10+ reps\nE) Incline DB Curl + Hammer Curls × 3 sets | 10+ reps\n3-sec eccentric — target mind-muscle, calm the weights' },

    net:       { label: 'Outreach — Nutrition Clients', detail: 'Cold DM 5 potential nutrition consultation clients\nFriends-of-friends or niche followers — warm, helpful tone' },

  },
  4: {
    gym:       { label: 'High-Rep Calisthenics — AMRAP 30 min', detail: 'Pushups + Pull-ups + Core circuit\nAs many rounds as possible in 30 min — clean reps only\nNo jerk motion. If rep not clean, it doesn\'t count.' },
    cds:       { label: 'History — Medieval India + Weekly Vocab Revision', detail: 'Sultanate era + Mughal era (Disha NCERT summary)\n+ Revise all vocab words collected this week' },
    cse:       { label: 'Blockchain Portfolio Update', detail: 'Update Secure Voting Framework (Hyperledger Fabric)\nPush a clean commit to GitHub — this is your portfolio proof' },
    yt:        { label: 'Asset Handoff to Editing Team', detail: 'Package project files\nMusic/SFX notes, edit instructions, upload deadline reminder' },
    net:       { label: 'Outreach — Nutrition Clients cont.', detail: 'Continue cold DMs — follow up on any Thursday replies\nGoal: get one response this week' },
    skin:      { label: 'Skincare', detail: 'AM: Ice plunge 2 min → face wash → moisturiser → SPF 50\nPM: Double cleanse → eye cream → barrier cream' },
  },
  5: {
    gym:       { label: 'Legs — Main: Squats / Hack Squat', detail: 'A) Squats / Hack Squat × 4 sets | 6–10 reps | 2–3 min rest\nB) Lying Leg Curl / RDL × 3 sets | 8–12 reps\nC) Leg Extensions × 3 sets | 10+ reps\nD) Hip Thrusts × 3 sets | 10+ reps\nE) Calves × 3 sets | 10+ reps\nBottom held still — no bounce, 3-sec eccentric' },
    cds:       { label: 'Science — Physics & Biology', detail: 'NCERT Class 9–10 highlights (Disha summary)\n+ Short notes review of the entire week' },
    cse:       { label: 'Freelance Readiness', detail: 'Work on your "Hire Me" page — 3 clear productised services\nSkills to show: AI tools, debugging, blockchain, vibe-coding' },
    yt:        { label: 'Review Edited Draft', detail: 'Review the edited shorts from your team\nRequest specific changes — music timing, transitions, pacing' },
    invest:    { label: 'Investment Log', detail: 'Log current value: Silver ETFs + Mutual Funds + Gold\nRead one weekly market wrap-up — REITs + major tech moves' },
    skin:      { label: 'Skincare + Weekly Treatment', detail: 'AM: Ice plunge → face wash → moisturiser → SPF 50\nPM: Weekly deep exfoliating mask (mom\'s recommendation) → barrier cream' },
  },
  6: {
    gym:       { label: 'Full Rest Day', detail: 'No physical activity\nRest is training — this is when you actually grow' },
    cds:       { label: 'Full Mock Test — Both Papers', detail: 'English + GK under timed conditions\nNo phone, no breaks — treat it like exam day\nAfter: detailed mistake analysis — WHY was each wrong?' },
    cse:       { label: 'System Review & GitHub Push', detail: 'Document everything built this week\nPush all code to GitHub — clean commits, clear messages' },
    yt:        { label: 'Channel Admin', detail: 'Upload finalised shorts\nSEO descriptions + community post planning\nCheck analytics from previous uploads' },
    net:       { label: 'Social — Friends & Catch-up', detail: 'In person or over gaming\nThis is scheduled, not optional — maintain the social life' },
    skin:      { label: 'Skincare', detail: 'AM: Ice plunge → face wash → moisturiser → SPF 50\nPM: Double cleanse → eye cream → barrier cream' },
  },
};

// STATE — stored in localStorage
function getStorageKey(day) { return `cmd_tasks_d${day}`; }
function getCheckedKey(day) { return `cmd_checked_d${day}`; }
function getCheckedDateKey(day) { return `cmd_checked_date_d${day}`; }

function loadTasks(day) {
  try {
    const saved = localStorage.getItem(getStorageKey(day));
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  // Return base schedule for this day
  const base = BASE_SCHEDULE[day] || {};
  return Object.entries(base).map(([key, val]) => ({ id: key + '_base', section: key, label: val.label, detail: val.detail }));
}

function saveTasks(day, tasks) {
  try { localStorage.setItem(getStorageKey(day), JSON.stringify(tasks)); } catch(e) {}
}

function loadChecked(day) {
  try {
    const dateKey = getCheckedDateKey(day);
    const savedDate = localStorage.getItem(dateKey);
    const today = new Date().toDateString();
    // Reset checked state if it's a new week occurrence of this day
    if (savedDate !== today + '_' + day) return {};
    const saved = localStorage.getItem(getCheckedKey(day));
    return saved ? JSON.parse(saved) : {};
  } catch(e) { return {}; }
}

function saveChecked(day, checked) {
  try {
    const today = new Date().toDateString();
    localStorage.setItem(getCheckedDateKey(day), today + '_' + day);
    localStorage.setItem(getCheckedKey(day), JSON.stringify(checked));
  } catch(e) {}
}

let currentDay = (() => {
  const d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
})();

let tasksCache = {};
let checkedCache = {};

function getTasks(day) {
  if (!tasksCache[day]) tasksCache[day] = loadTasks(day);
  return tasksCache[day];
}

function getChecked(day) {
  if (!checkedCache[day]) checkedCache[day] = loadChecked(day);
  return checkedCache[day];
}

function calcProgress(day) {
  const tasks = getTasks(day);
  const checked = getChecked(day);
  if (!tasks.length) return 0;
  return Math.round((Object.values(checked).filter(Boolean).length / tasks.length) * 100);
}

function showSaved() {
  const el = document.getElementById('saved-indicator');
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

function updateHeader(day) {
  document.getElementById('day-name').textContent = FULL[day];
  const d = new Date();
  document.getElementById('day-date').textContent = d.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const pct = calcProgress(day);
  document.getElementById('pct-display').textContent = pct + '%';
  document.getElementById('pbar').style.width = pct + '%';
}

function renderNav() {
  const nav = document.getElementById('day-nav');
  nav.innerHTML = '';
  DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i === currentDay ? ' active' : '');
    btn.textContent = d;
    btn.onclick = () => { currentDay = i; renderAll(); };
    nav.appendChild(btn);
  });
}

let addFormOpen = null; // section key or null

function renderTasks(day) {
  const area = document.getElementById('task-area');
  area.innerHTML = '';
  const tasks = getTasks(day);
  const checked = getChecked(day);

  // Group by section
  const sections = {};
  tasks.forEach(t => {
    if (!sections[t.section]) sections[t.section] = [];
    sections[t.section].push(t);
  });

  // Render each section
  Object.entries(sections).forEach(([secKey, secTasks]) => {
    const meta = SECTION_META[secKey] || SECTION_META.custom;
    const wrap = document.createElement('div');
    wrap.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<div class="section-dot" style="background:${meta.color}"></div><div class="section-title">${meta.label}</div>`;
    wrap.appendChild(header);

    secTasks.forEach(t => {
      const isDone = !!checked[t.id];
      const taskEl = document.createElement('div');
      taskEl.className = 'task' + (isDone ? ' done' : '');
      taskEl.innerHTML = `
        <div class="cb">${isDone ? '✓' : ''}</div>
        <div class="task-content">
          <div class="task-title">${t.label}</div>
          <div class="task-sub">${t.detail.replace(/\n/g, '<br>')}</div>
        </div>
        <button class="task-delete" title="Remove task" data-id="${t.id}">✕</button>
      `;
      taskEl.querySelector('.cb').onclick = (e) => {
        e.stopPropagation();
        checked[t.id] = !checked[t.id];
        checkedCache[day] = checked;
        saveChecked(day, checked);
        showSaved();
        renderAll();
      };
      taskEl.querySelector('.task-title').onclick = (e) => {
        e.stopPropagation();
        checked[t.id] = !checked[t.id];
        checkedCache[day] = checked;
        saveChecked(day, checked);
        showSaved();
        renderAll();
      };
      taskEl.querySelector('.task-delete').onclick = (e) => {
        e.stopPropagation();
        if (!confirm('Remove this task?')) return;
        tasksCache[day] = getTasks(day).filter(x => x.id !== t.id);
        saveTasks(day, tasksCache[day]);
        showSaved();
        renderAll();
      };
      wrap.appendChild(taskEl);
    });
    area.appendChild(wrap);
  });

  // Add Task button
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.innerHTML = '+ add task to today';
  addBtn.onclick = () => { addFormOpen = true; renderTasks(day); };
  area.appendChild(addBtn);

  // Add task form
  if (addFormOpen) {
    const form = document.createElement('div');
    form.className = 'add-form';
    form.innerHTML = `
      <select id="new-section">
        ${Object.entries(SECTION_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('')}
      </select>
      <input id="new-title" type="text" placeholder="Task title (e.g. Read Polity chapter 3)" />
      <textarea id="new-detail" placeholder="Details (optional — what exactly to do, sets/reps, links, etc.)"></textarea>
      <div class="form-row">
        <button class="btn-save" id="save-new-task">Save Task</button>
        <button class="btn-cancel" id="cancel-new-task">Cancel</button>
      </div>
    `;
    area.appendChild(form);

    document.getElementById('save-new-task').onclick = () => {
      const section = document.getElementById('new-section').value;
      const label = document.getElementById('new-title').value.trim();
      const detail = document.getElementById('new-detail').value.trim();
      if (!label) { alert('Give the task a title'); return; }
      const id = section + '_' + Date.now();
      tasksCache[day] = [...getTasks(day), { id, section, label, detail }];
      saveTasks(day, tasksCache[day]);
      addFormOpen = null;
      showSaved();
      renderAll();
    };

    document.getElementById('cancel-new-task').onclick = () => {
      addFormOpen = null;
      renderAll();
    };
  }

  // Reset button
  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-day-btn';
  resetBtn.textContent = 'reset today\'s checkboxes';
  resetBtn.onclick = () => {
    if (!confirm('Reset all checkboxes for today?')) return;
    checkedCache[day] = {};
    saveChecked(day, {});
    renderAll();
  };
  area.appendChild(resetBtn);
}

function renderAll() {
  renderNav();
  updateHeader(currentDay);
  renderTasks(currentDay);
}

renderAll();

// Auto-switch day at midnight
setInterval(() => {
  const d = new Date().getDay();
  const newDay = d === 0 ? 6 : d - 1;
  if (newDay !== currentDay) {
    currentDay = newDay;
    renderAll();
  }
}, 60000);
</script>
</body>
</html>
